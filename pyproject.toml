[project]
name = "agapps"
version = "0.1.0"
description = "A command-line tool for viewing AI agent application configurations, including MCPs and custom rules."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Jonathan Yang"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.2.0",
    "pydantic>=2.11.4",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "tabulate>=0.9.0",
]

[dependency-groups]
dev = [
  "pre-commit",
  "ty",
  "pytest",
  "ruff",
]

[project.scripts]
agapps = "agapps.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agapps"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
addopts = "-ra --import-mode=prepend"

[project.urls]
Homepage = "https://github.com/Joilence/agapps"
Repository = "https://github.com/Joilence/agapps"
"Bug Tracker" = "https://github.com/Joilence/agapps/issues"
